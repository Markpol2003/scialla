<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <linearGradient id="gcashBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005CE6" />
      <stop offset="100%" stop-color="#003B96" />
    </linearGradient>
    <filter id="qrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="320" height="380" rx="20" fill="#ffffff" filter="url(#qrShadow)"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="320" height="70" rx="20" fill="url(#gcashBlue)"/>
  <rect x="0" y="50" width="320" height="20" fill="url(#gcashBlue)"/>

  <!-- GCash Logo Text -->
  <text x="160" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">GCash</text>

  <!-- Merchant Info -->
  <text x="160" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#11100E" text-anchor="middle">SCIALLA CAFE</text>
  <text x="160" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#005CE6" text-anchor="middle">SCAN TO PAY WITH GCASH</text>

  <!-- QR Code Frame -->
  <rect x="50" y="130" width="220" height="220" rx="12" fill="#F4F8FF" stroke="#005CE6" stroke-width="2"/>

  <!-- QR Code Pattern -->
  <g fill="#003B96">
    <!-- Top Left Position Pattern -->
    <rect x="70" y="150" width="50" height="50" rx="6" />
    <rect x="78" y="158" width="34" height="34" rx="3" fill="#ffffff" />
    <rect x="86" y="166" width="18" height="18" rx="2" />

    <!-- Top Right Position Pattern -->
    <rect x="200" y="150" width="50" height="50" rx="6" />
    <rect x="208" y="158" width="34" height="34" rx="3" fill="#ffffff" />
    <rect x="216" y="166" width="18" height="18" rx="2" />

    <!-- Bottom Left Position Pattern -->
    <rect x="70" y="280" width="50" height="50" rx="6" />
    <rect x="78" y="288" width="34" height="34" rx="3" fill="#ffffff" />
    <rect x="86" y="296" width="18" height="18" rx="2" />

    <!-- Data Blocks Sample -->
    <rect x="135" y="150" width="12" height="12" rx="2"/>
    <rect x="155" y="150" width="12" height="24" rx="2"/>
    <rect x="175" y="150" width="12" height="12" rx="2"/>

    <rect x="135" y="170" width="24" height="12" rx="2"/>
    <rect x="165" y="170" width="22" height="22" rx="2"/>

    <rect x="135" y="200" width="115" height="12" rx="2"/>
    <rect x="70" y="210" width="20" height="12" rx="2"/>
    <rect x="100" y="210" width="12" height="30" rx="2"/>

    <rect x="135" y="225" width="30" height="30" rx="4"/>
    <rect x="175" y="225" width="20" height="12" rx="2"/>
    <rect x="205" y="225" width="45" height="12" rx="2"/>

    <rect x="70" y="250" width="45" height="12" rx="2"/>
    <rect x="125" y="250" width="20" height="20" rx="2"/>
    <rect x="155" y="250" width="40" height="12" rx="2"/>
    <rect x="205" y="250" width="45" height="20" rx="2"/>

    <rect x="135" y="280" width="30" height="20" rx="2"/>
    <rect x="175" y="280" width="20" height="50" rx="2"/>
    <rect x="205" y="280" width="45" height="20" rx="2"/>

    <rect x="135" y="310" width="30" height="20" rx="2"/>
    <rect x="205" y="310" width="45" height="20" rx="2"/>
  </g>

  <!-- Center GCash Icon -->
  <circle cx="160" cy="240" r="22" fill="#005CE6" stroke="#ffffff" stroke-width="3"/>
  <text x="160" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>

  <!-- Footer Tag -->
  <text x="160" y="364" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#7A7065" text-anchor="middle">Merchant Account: Scialla Cafe • 0917-123-4567</text>
</svg>
