<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2314" />
      <stop offset="100%" stop-color="#1A0D07" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7ECE1" />
      <stop offset="100%" stop-color="#E2D4C5" />
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C98B5B" />
      <stop offset="100%" stop-color="#8B4A26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C68F" />
      <stop offset="100%" stop-color="#C98B5B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Steam curves -->
  <path d="M25 19 C23 15 27 13 25 9" stroke="#E6B87D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M32 17 C30 13 34 11 32 7" stroke="#F3C68F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95" />
  <path d="M39 19 C37 15 41 13 39 9" stroke="#E6B87D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Coffee Cup Body -->
  <path d="M16 25 L48 25 L44 45 C43.5 48 40.5 50 37 50 L27 50 C23.5 50 20.5 48 20 45 Z" fill="url(#cupGrad)" filter="url(#glow)"/>
  
  <!-- Cup Handle -->
  <path d="M46 28 C51 28 53 32 52 37 C51 41 46 42 45 42" stroke="url(#cupGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Liquid Surface -->
  <ellipse cx="32" cy="25" rx="16" ry="3" fill="url(#coffeeGrad)" />
  
  <!-- Heart Latte Art -->
  <path d="M32 26.8 C30.5 24.5 27 25 28.5 26.8 L32 29 L35.5 26.8 C37 25 33.5 24.5 32 26.8 Z" fill="#FDF8F5" opacity="0.9" />

  <!-- Saucer Plate -->
  <path d="M14 52 C14 52 23 55 32 55 C41 55 50 52 50 52 C51.5 52 52 53 50.5 54 C46 57 39 58 32 58 C25 58 18 57 13.5 54 C12 53 12.5 52 14 52 Z" fill="url(#goldGrad)" opacity="0.9" />
</svg>